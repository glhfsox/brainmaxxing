# Lint, the package build and the app build on every push to main and every pull request.
# The same lint and build run locally before a push through .githooks/pre-push.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so a new SwiftLint release cannot turn `--strict` red without a code change; bump together with .swiftlint.yml.
  SWIFTLINT_VERSION: 0.65.1
  SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0

# macos-26 ships Xcode 26.x with the image default selected; the package needs Swift 6.2 or newer.
jobs:
  lint:
    name: SwiftLint
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install SwiftLint ${{ env.SWIFTLINT_VERSION }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          echo "${SWIFTLINT_SHA256}  $RUNNER_TEMP/swiftlint.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
      - name: swiftlint --strict
        run: swiftlint lint --strict --reporter github-actions-logging

  build:
    name: swift build
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        id: toolchain
        run: |
          swift --version
          echo "id=$(swift --version 2>&1 | grep -o 'swiftlang-[0-9.]*' | head -n1 || true)" >> "$GITHUB_OUTPUT"
      # Keyed by job, compiler build and resolved dependencies, so a .build from another compiler is never reused.
      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-build-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-build-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-
      - name: swift build
        run: swift build

  app:
    name: xcodebuild app
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Toolchain
        id: toolchain
        run: echo "id=$(swift --version 2>&1 | grep -o 'swiftlang-[0-9.]*' | head -n1 || true)" >> "$GITHUB_OUTPUT"
      # The post-build script embeds digest-cli and DigestMCP with `swift build` in the repo, so .build is cached here too.
      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-app-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: spm-app-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-
      - name: xcodegen generate
        run: xcodegen generate
      # Ad-hoc signing from project.yml; no certificate is needed on the runner.
      - name: xcodebuild Debug
        run: |
          xcodebuild -project brainmaxxing.xcodeproj -scheme brainmaxxing -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath build/DerivedData build -quiet
